# Ported 1:1 from ssvlabs/ssv-subgraph schema.graphql (commit e2f1aa0).
# Type mapping: Bytes -> String (lowercase 0x hex), BigInt -> BigInt,
# Int -> Int, enums -> enums. @entity(immutable: ...) directives removed
# (HyperIndex types are plain `type X`). @derivedFrom kept.

type Account {
  id: ID! # address (lowercase hex)
  nonce: BigInt!
  validatorCount: BigInt! # uint256
  clusters: [Cluster!]! @derivedFrom(field: "owner")
  validators: [Validator!]! @derivedFrom(field: "owner")
  operators: [Operator!]! @derivedFrom(field: "owner")
  effectiveBalance: BigInt! # uint256
  feeRecipient: String! # address
  stakedAmount: BigInt!
  unstakePendingAmount: BigInt!
}

type Cluster {
  id: ID! # concat owner + operatorIds
  owner: Account! # address
  operatorIds: [BigInt!]! # uint64[]
  validatorCount: BigInt! # uint32
  effectiveBalance: BigInt! # uint256
  vUnits: BigInt! # uint256
  validators: [Validator!]! @derivedFrom(field: "cluster")
  feeAsset: ClusterFeeAssetTypes!
  networkFeeIndex: BigInt! # uint64
  index: BigInt! # uint64
  active: Boolean! # bool
  balance: BigInt! # uint256
  lastUpdateBlockNumber: BigInt! # uint256
  lastUpdateBlockTimestamp: BigInt!
  lastUpdateTransactionHash: String!
}

enum ClusterFeeAssetTypes {
  SSV
  ETH
}

type Validator {
  id: ID! # publicKey (lowercase hex)
  owner: Account! # address
  # subgraph: [Operator!]! (list of Operator references). HyperIndex cannot
  # store arrays of entity references, so this is stored as the array of
  # operator-id strings the subgraph would have stored (byte-for-byte the same
  # values), and Operator.validators @derivedFrom(field:"operators") is dropped.
  operators: [String!]! # uint64[] operator ids
  cluster: Cluster!
  removed: Boolean! # bool
  shares: String! # bytes
  lastUpdateBlockNumber: BigInt! # uint256
  lastUpdateBlockTimestamp: BigInt!
  lastUpdateTransactionHash: String!
}

type Operator {
  id: ID! # uint64 as string
  operatorId: BigInt!
  owner: Account! # address
  publicKey: String! # bytes
  removed: Boolean! # bool
  fee: BigInt! # uint256
  feeIndex: BigInt! # uint256
  feeIndexBlockNumber: BigInt! # uint256
  declaredFee: BigInt! # uint256
  feeSSV: BigInt! # uint256
  feeIndexSSV: BigInt! # uint256
  feeIndexBlockNumberSSV: BigInt! # uint256
  declaredSSVFee: BigInt! # uint256
  # subgraph: [Account!]! (list of Account references). Stored as the array of
  # account-id (lowercase address) strings the subgraph stored.
  whitelisted: [String!]!
  whitelistedContract: String! # address
  isPrivate: Boolean! # bool
  totalWithdrawn: BigInt! # uint256
  totalWithdrawnSSV: BigInt! # uint256
  totalEffectiveBalance: BigInt! # uint256
  lastUpdateBlockNumber: BigInt! # uint256
  lastUpdateBlockTimestamp: BigInt!
  lastUpdateTransactionHash: String!
  validatorCount: BigInt! # uint256
  # NB: subgraph had `validators: [Validator!] @derivedFrom(field: "operators")`.
  # Dropped: HyperIndex cannot derive from an array-of-strings field. The
  # relation is query-only and never read inside mappings, so data parity for
  # all written entities is unaffected.
}

