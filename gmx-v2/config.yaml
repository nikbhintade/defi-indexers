# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: gmx-v2
description: GMX V2 (synthetics-stats) subgraph ported to HyperIndex (Arbitrum / chain 42161)
rollback_on_reorg: false
contracts:
  # ---- Main data source: generic EventEmitter ----
  # EventLog / EventLog1 / EventLog2 carry a nested EventUtils.EventLogData tuple
  # (eventData) of (key,value) items. We register each once and dispatch on eventName.
  - name: EventEmitter
    abi_file_path: ./abis/EventEmitter.json
    events:
      - event: EventLog
        field_selection:
          transaction_fields: [hash, from, to, transactionIndex]
      - event: EventLog1
        field_selection:
          transaction_fields: [hash, from, to, transactionIndex]
      - event: EventLog2
        field_selection:
          transaction_fields: [hash, from, to, transactionIndex]
  # ---- Legacy GMX V1 stat sources ----
  - name: Vault
    events:
      - event: "SellUSDG(address account, address token, uint256 usdgAmount, uint256 tokenAmount, uint256 feeBasisPoints)"
        field_selection:
          transaction_fields: [hash]
  - name: GlpManager
    events:
      - event: "RemoveLiquidity(address account, address token, uint256 glpAmount, uint256 aumInUsdg, uint256 glpSupply, uint256 usdgAmount, uint256 amountOut)"
        field_selection:
          transaction_fields: [hash]
  - name: BatchSender
    events:
      - event: "BatchSend(uint256 indexed typeId, address indexed token, address[] accounts, uint256[] amounts)"
        field_selection:
          transaction_fields: [hash]
  # ---- Dynamic templates (registered when markets / GLVs are created) ----
  - name: MarketTokenTemplate
    events:
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"
        field_selection:
          transaction_fields: [hash, from, to, transactionIndex]
  - name: GlvTokenTemplate
    events:
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"
chains:
  - id: 42161
    start_block: 107737756
    # end_block: 107787756   # 107737756 + 50k — uncomment for bounded validation runs (see validation.json)
    contracts:
      - name: EventEmitter
        address: "0xC8ee91A54287DB53897056e12D9819156D3822Fb"
      - name: Vault
        address: "0x489ee077994B6658eAfA855C308275EAd8097C4A"
      - name: GlpManager
        address: "0x3963FfC9dff443c2A94f21b129D429891E32ec18"
      # BatchSender + BatchSenderNew share the BatchSend signature -> both listed under BatchSender
      - name: BatchSender
        address:
          - "0x1070f775e8eb466154BBa8FA0076C4Adc7FE17e8"
          - "0x5384E6cAd96B2877B5B3337A277577053BD1941D"
      # dynamically registered templates (no static address)
      - name: MarketTokenTemplate
      - name: GlvTokenTemplate
