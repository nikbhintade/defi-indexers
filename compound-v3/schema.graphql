}

type HourlyMarketAccounting {
    "Market ID + hour"
    id: ID!
    "Hours since unix epoch"
    hour: BigInt!
    "Seconds since unix epoch"
    timestamp: BigInt!
    "Market the accounting if for"
    market: Market!
    "Accounting snapshot"
    accounting: MarketAccounting!
}

type DailyMarketAccounting {
    "Market ID + day"
    id: ID!
    "Days since unix epoch"
    day: BigInt!
    "Seconds since unix epoch"
    timestamp: BigInt!
    "Market the accounting is for"
    market: Market!
    "Accounting snapshot"
    accounting: MarketAccounting!
}

type WeeklyMarketAccounting {
    "Market ID + week"
    id: ID!
    "Weeks since unix epoch"
    week: BigInt!
    "Seconds since unix epoch"
    timestamp: BigInt!
    "Market the accounting if for"
    market: Market!
    "Accounting snapshot"
