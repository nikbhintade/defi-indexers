#
# M0 protocol subgraph -> HyperIndex port.
# Type mapping: Bytes -> String (lowercase 0x hex), BigInt -> BigInt.
# @entity(immutable: ...) directives removed (HyperIndex types are plain types).
# All entity type names are PascalCase (required by envio 3.x).
#
#
# MinterGateway events
#
type BurnExecuted {
  id: ID!
  minter: String! # address
  principalAmount: BigInt # uint112
  amount: BigInt! # uint240
  payer: String! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: String!
}

type CollateralUpdated {
  id: ID!
  minter: String! # address
  collateral: BigInt! # uint240
  totalResolvedCollateralRetrieval: BigInt! # uint240
  metadataHash: String! # bytes32
  timestamp: BigInt! # uint40
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: String!
}

type IndexUpdated {
  id: ID!
  index: BigInt! # uint128
  rate: BigInt! # uint32
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: String!
}

