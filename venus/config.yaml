# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: venus-indexer
description: Venus Protocol core-pool subgraph (BNB Smart Chain) ported to HyperIndex
rollback_on_reorg: false
contracts:
  # Venus core-pool Comptroller (Diamond / Unitroller). The subgraph splits this
  # across two data sources (DiamondComptroller + Comptroller) at the same
  # address; merged here into one contract entry. Event signatures are the
  # *deployed* core-pool ones from packages/venus-core-pool-abis/Comptroller.json
  # (the latest DiamondConsolidated.json has diverged: pool-aware
  # NewCollateralFactor/NewLiquidationIncentive that were never emitted at the
  # core-pool start block). topic0 depends only on name+types, not `indexed`.
  - name: Comptroller
    events:
      - event: "MarketListed(address vToken)"
      - event: "MarketUnlisted(address vToken)"
      - event: "MarketEntered(address vToken, address account)"
      - event: "MarketExited(address vToken, address account)"
      - event: "NewCloseFactor(uint256 oldCloseFactorMantissa, uint256 newCloseFactorMantissa)"
      - event: "NewCollateralFactor(address vToken, uint256 oldCollateralFactorMantissa, uint256 newCollateralFactorMantissa)"
      - event: "NewLiquidationIncentive(uint256 oldLiquidationIncentiveMantissa, uint256 newLiquidationIncentiveMantissa)"
      - event: "NewPriceOracle(address oldPriceOracle, address newPriceOracle)"
      - event: "DistributedBorrowerVenus(address indexed vToken, address indexed borrower, uint256 venusDelta, uint256 venusBorrowIndex)"
      - event: "DistributedSupplierVenus(address indexed vToken, address indexed supplier, uint256 venusDelta, uint256 venusSupplyIndex)"
      - event: "VenusBorrowSpeedUpdated(address indexed vToken, uint256 newSpeed)"
      - event: "VenusSupplySpeedUpdated(address indexed vToken, uint256 newSpeed)"
      - event: "VenusSpeedUpdated(address indexed vToken, uint256 newSpeed)"
  # Subgraph template `VToken` (orig-events / v1 signatures: 3-4 param
  # Mint/MintBehalf/Redeem). Registered dynamically on market creation.
  - name: VToken
    events:
      - event: "Mint(address minter, uint256 mintAmount, uint256 mintTokens)"
        field_selection:
          transaction_fields: [hash]
      - event: "MintBehalf(address payer, address receiver, uint256 mintAmount, uint256 mintTokens)"
        field_selection:
          transaction_fields: [hash]
      - event: "Redeem(address redeemer, uint256 redeemAmount, uint256 redeemTokens)"
        field_selection:
          transaction_fields: [hash]
      - event: "Borrow(address borrower, uint256 borrowAmount, uint256 accountBorrows, uint256 totalBorrows)"
        field_selection:
          transaction_fields: [hash]
      - event: "RepayBorrow(address payer, address borrower, uint256 repayAmount, uint256 accountBorrows, uint256 totalBorrows)"
        field_selection:
          transaction_fields: [hash]
      - event: "LiquidateBorrow(address liquidator, address borrower, uint256 repayAmount, address vTokenCollateral, uint256 seizeTokens)"
        field_selection:
          transaction_fields: [hash]
      - event: "AccrueInterest(uint256 cashPrior, uint256 interestAccumulated, uint256 borrowIndex, uint256 totalBorrows)"
      - event: "NewReserveFactor(uint256 oldReserveFactorMantissa, uint256 newReserveFactorMantissa)"
      - event: "Transfer(address indexed from, address indexed to, uint256 amount)"
        field_selection:
          transaction_fields: [hash]
      - event: "NewMarketInterestRateModel(address oldInterestRateModel, address newInterestRateModel)"
      - event: "ReservesAdded(address benefactor, uint256 addAmount, uint256 newTotalReserves)"
      - event: "ReservesReduced(address protocolShareReserve, uint256 reduceAmount, uint256 newTotalReserves)"
  # Subgraph template `VTokenUpdatedEvents` (current / v2 signatures: extra
  # totalSupply param). Same vToken addresses, distinct topic0 (different arity).
  - name: VTokenUpdatedEvents
    events:
      - event: "Mint(address minter, uint256 mintAmount, uint256 mintTokens, uint256 totalSupply)"
        field_selection:
          transaction_fields: [hash]
      - event: "MintBehalf(address payer, address receiver, uint256 mintAmount, uint256 mintTokens, uint256 totalSupply)"
        field_selection:
          transaction_fields: [hash]
      - event: "Redeem(address redeemer, uint256 redeemAmount, uint256 redeemTokens, uint256 totalSupply)"
        field_selection:
          transaction_fields: [hash]
chains:
  - id: 56
    start_block: 2471512
    # end_block: 2521512   # uncomment for bounded validation runs (start + ~50k, see validation.json)
    contracts:
      - name: Comptroller
        address: "0xfD36E2c2a6789Db23113685031d7F16329158384"
      # dynamically registered templates (no static address)
      - name: VToken
      - name: VTokenUpdatedEvents
