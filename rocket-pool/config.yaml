# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: rocket-pool-indexer
description: Rocket Pool (rETH liquid staking, node operators, minipools) subgraph ported to HyperIndex
rollback_on_reorg: false
# Most entity ids are `txHash-logIndex` and several entities also store the tx
# hash, so transaction.hash is required network-wide.
field_selection:
  transaction_fields: [hash]
contracts:
  # ---- rETH token ----
  - name: RocketTokenRETH
    abi_file_path: ./abis/rocketTokenRETH.json
    events:
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"

  # ---- Network balances (legacy + Atlas share the same event/handler) ----
  - name: RocketNetworkBalances
    abi_file_path: ./abis/rocketNetworkBalances.json
    events:
      - event: "BalancesUpdated(uint256 block, uint256 totalEth, uint256 stakingEth, uint256 rethSupply, uint256 time)"

  # ---- Node manager (V1 + Redstone + V3 all share NodeRegistered/NodeTimezoneLocationSet) ----
  - name: RocketNodeManager
    abi_file_path: ./abis/rocketNodeManager.json
    events:
      - event: "NodeRegistered(address indexed node, uint256 time)"
      - event: "NodeTimezoneLocationSet(address indexed node, uint256 time)"

  # ---- Node staking (legacy + Redstone + Atlas) ----
  - name: RocketNodeStaking
    abi_file_path: ./abis/rocketNodeStaking.json
    events:
      - event: "RPLStaked(address indexed from, uint256 amount, uint256 time)"
      - event: "RPLWithdrawn(address indexed to, uint256 amount, uint256 time)"
      - event: "RPLSlashed(address indexed node, uint256 amount, uint256 ethValue, uint256 time)"

  # ---- Rewards pool (legacy RPLTokensClaimed) ----
  - name: RocketRewardsPool
    abi_file_path: ./abis/rocketRewardsPool.json
    events:
      - event: "RPLTokensClaimed(address indexed claimingContract, address indexed claimingAddress, uint256 amount, uint256 time)"

  # ---- Rewards pool Redstone/Atlas (RewardSnapshot) ----
  - name: RocketRewardsPoolRedstone
    abi_file_path: ./abis/rocketRewardsPoolRedstone.json
    events:
      - event: "RewardSnapshot(uint256 indexed rewardIndex, (uint256 rewardIndex, uint256 executionBlock, uint256 consensusBlock, bytes32 merkleRoot, string merkleTreeCID, uint256 intervalsPassed, uint256 treasuryRPL, uint256[] trustedNodeRPL, uint256[] nodeRPL, uint256[] nodeETH, uint256 userETH) submission, uint256 intervalStartTime, uint256 intervalEndTime, uint256 time)"

  # ---- Network prices (legacy PricesUpdated, 4 args) ----
  - name: RocketNetworkPrices
    abi_file_path: ./abis/rocketNetworkPrices.json
    events:
      - event: "PricesUpdated(uint256 block, uint256 rplPrice, uint256 effectiveRplStake, uint256 time)"

  # ---- Network prices Atlas (PricesUpdated, 3 args) ----
  - name: RocketNetworkPricesAtlas
    abi_file_path: ./abis/rocketNetworkPrices.json
    events:
      - event: "PricesUpdated(uint256 block, uint256 rplPrice, uint256 time)"

  # ---- Minipool manager (V1 + V2 + Redstone + Atlas) ----
  - name: RocketMinipoolManager
    abi_file_path: ./abis/rocketMinipoolManager.json
    events:
      - event: "MinipoolCreated(address indexed minipool, address indexed node, uint256 time)"
      - event: "MinipoolDestroyed(address indexed minipool, address indexed node, uint256 time)"

  # ---- Minipool queue ----
  - name: RocketMinipoolQueue
    abi_file_path: ./abis/rocketMinipoolQueue.json
    events:
      - event: "MinipoolEnqueued(address indexed minipool, bytes32 indexed queueId, uint256 time)"
      - event: "MinipoolDequeued(address indexed minipool, bytes32 indexed queueId, uint256 time)"

  # ---- DAO node trusted actions (ODAO membership) ----
  - name: RocketDAONodeTrustedActions
    abi_file_path: ./abis/rocketDAONodeTrustedActions.json
    events:
      - event: "ActionJoined(address indexed nodeAddress, uint256 rplBondAmount, uint256 time)"
      - event: "ActionLeave(address indexed nodeAddress, uint256 rplBondAmount, uint256 time)"
      - event: "ActionKick(address indexed nodeAddress, uint256 rplBondAmount, uint256 time)"
      - event: "ActionChallengeDecided(address indexed nodeChallengedAddress, address indexed nodeChallengeDeciderAddress, bool success, uint256 time)"

  # ---- Smoothing pool ----
  - name: RocketSmoothingPool
    abi_file_path: ./abis/rocketSmoothingPool.json
    events:
      - event: "NodeSmoothingPoolStateChanged(address indexed node, bool state)"

  # ---- Minipool delegate (subgraph template; dynamically registered on MinipoolCreated) ----
  - name: RocketMinipoolDelegate
    abi_file_path: ./abis/rocketMinipoolDelegate.json
    events:
      - event: "StatusUpdated(uint8 indexed status, uint256 time)"
      - event: "EtherDeposited(address indexed from, uint256 amount, uint256 time)"

