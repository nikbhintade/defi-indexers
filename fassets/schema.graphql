###############################################################################
# FAssets (Flare mainnet) — HyperIndex schema.
#
# Ported from flare-foundation/fasset-indexer (MikroORM entities). The original
# uses an auto-increment EvmLog PK that every event row points at (OneToOne).
# HyperIndex needs string ids, so per-event records use id = chainId_block_logIndex
# (lowercase). State / lookup entities use their natural key (agent vault
# address, fasset enum value, or fasset_naturalId composites) so the storer's
# findOneOrFail(... { fasset, requestId }) lookups remain id-addressable.
#
# `fasset` is the FAssetType enum (FXRP=0, FBTC=1, FDOGE=2, ...) stored as Int,
# matching the source enum ordinal. All addresses/hex stored LOWERCASE.
###############################################################################

# ----------------------------------------------------------------------------
# core identity / state
# ----------------------------------------------------------------------------

type AgentManager {
  id: ID! # lowercase management address
  address: String!
  name: String
  description: String
  iconUrl: String
}

type AgentOwner {
  id: ID! # lowercase work address
  address: String!
  manager_id: String! @index
}

type AgentVault {
  id: ID! # lowercase agent vault address
  fasset: Int!
  address: String!
  underlyingAddress: String!
  collateralPool: String! @index
  collateralPoolToken: String
  collateralPoolTokenSymbol: String
  owner_id: String! @index
  destroyed: Boolean!
}

type AgentVaultSettings {
  id: ID! # lowercase agent vault address
  agentVault_id: String! @index
  collateralToken_id: String!
  feeBIPS: BigInt!
  poolFeeShareBIPS: BigInt!
  mintingVaultCollateralRatioBIPS: BigInt!
  mintingPoolCollateralRatioBIPS: BigInt!
  buyFAssetByAgentFactorBIPS: BigInt!
  poolExitCollateralRatioBIPS: BigInt!
  poolTopupCollateralRatioBIPS: BigInt
  poolTopupTokenPriceFactorBIPS: BigInt
  redemptionPoolFeeShareBIPS: BigInt
}

type AssetManagerSettings {
  id: ID! # fasset enum ordinal as string
  fasset: Int!
