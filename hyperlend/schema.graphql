# HyperLend (Aave-V3-style) — ported 1:1 from the Ponder `ponder.schema.ts`.
# Mapping: t.hex() -> String (lowercase 0x hex), t.bigint() -> BigInt,
# t.integer() -> Int, t.boolean() -> Boolean, t.text() -> String.
# Entity ids are Ponder `event.log.id` = `${block.hash}-${logIndex}` (lowercase).
# Price fields are nullable: the Ponder columns have no .notNull() and several
# handlers swallow oracle-read failures into a null price.

type Borrow {
  id: ID!
  txHash: String
  pool: String
  reserve: String
  user: String
  onBehalfOf: String @index
  amount: BigInt
  interestRateMode: Int
  borrowRate: BigInt
  referralCode: Int
  timestamp: Int
  price: BigInt
}

