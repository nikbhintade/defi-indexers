# Spiko Morpho Blue + MetaMorpho schema, ported 1:1 from the Messari lending
# subgraph (spiko-tech/morpho-blue-subgraph). Type mapping per CONVENTIONS.md:
#   Bytes -> String (lowercase 0x hex), BigInt -> BigInt, BigDecimal -> BigDecimal,
#   Int -> Int, enums -> enums, ID/Bytes ids -> id: ID!.
# @entity directives / interfaces removed; @derivedFrom kept; references kept.

enum Network {
  ARBITRUM_ONE
  ARWEAVE_MAINNET
  AURORA
  AVALANCHE
  BOBA
  BSC
  CELO
  COSMOS
  CRONOS
  MAINNET
  FANTOM
  FUSE
  HARMONY
  JUNO
  MOONBEAM
  MOONRIVER
  NEAR_MAINNET
  OPTIMISM
  OSMOSIS
  MATIC
  GNOSIS
  GOERLI
}

enum ProtocolType {
  EXCHANGE
  LENDING
  YIELD
  BRIDGE
  GENERIC
}

type Token {
  id: ID!
  name: String!
  symbol: String!
  decimals: Int!
  lastPriceUSD: BigDecimal
  lastPriceBlockNumber: BigInt
  type: TokenType
}

enum LendingType {
  CDP
  POOLED
}

enum PermissionType {
  WHITELIST_ONLY
  PERMISSIONED
  PERMISSIONLESS
  ADMIN
}

enum RiskType {
  GLOBAL
  ISOLATED
}

enum CollateralizationType {
  OVER_COLLATERALIZED
  UNDER_COLLATERALIZED
  UNCOLLATERALIZED
}

enum TokenType {
  REBASING
  NON_REBASING
}

enum InterestRateType {
  STABLE
  VARIABLE
  FIXED
}

enum InterestRateSide {
  LENDER
  BORROWER
}

enum Tranche {
  SENIOR
  JUNIOR
}

enum PositionSide {
  COLLATERAL
  SUPPLIER
  BORROWER
}

type InterestRate {
  id: ID!
