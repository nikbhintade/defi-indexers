}

enum FeeType {
  LIQUIDATION_FEE
  ADMIN_FEE
  PROTOCOL_FEE
  MINT_FEE
  WITHDRAW_FEE
  FLASHLOAN_PROTOCOL_FEE
  FLASHLOAN_LP_FEE
