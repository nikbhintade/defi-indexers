"""
Centrifuge api-v3 (Ponder) → HyperIndex port. Ethereum mainnet (chainId 1) only.
Entity names + field names mirror the Ponder onchainTable definitions in ponder.schema.ts.
Composite primary keys are collapsed into a single `id: ID!` built from the same key
parts (joined with `-`) the Ponder code uses, in the same column order.

Type mapping: t.hex()->String (lowercase), t.bigint()->BigInt, t.integer()->Int,
t.boolean()->Boolean, t.text()->String, t.timestamp()->Timestamp, onchainEnum->enum.
Audit columns (createdAt*/updatedAt*) preserved as in the source.
"""

# ---------------------------------------------------------------------------
# Enums (onchainEnum)
# ---------------------------------------------------------------------------
enum VaultKind {
  Async
  Sync
  SyncDepositAsyncRedeem
}
enum VaultStatus {
  LinkInProgress
  UnlinkInProgress
  Linked
  Unlinked
}
enum VaultCrosschainInProgress {
  Deploy
  Link
  Unlink
  MaxReserve
}
enum InvestorTransactionType {
  DEPOSIT_REQUEST_UPDATED
  REDEEM_REQUEST_UPDATED
  DEPOSIT_REQUEST_CANCELLED
  REDEEM_REQUEST_CANCELLED
  DEPOSIT_REQUEST_EXECUTED
  REDEEM_REQUEST_EXECUTED
  DEPOSIT_CLAIMABLE
  REDEEM_CLAIMABLE
  DEPOSIT_CLAIMED
  REDEEM_CLAIMED
  SYNC_DEPOSIT
  SYNC_REDEEM
  TRANSFER_IN
  TRANSFER_OUT
}
enum HoldingAccountType {
  Asset
  Equity
  Loss
  Gain
  Expense
  Liability
}
enum HoldingEscrowCrosschainInProgress {
  NotifyAssetPrice
}
enum TokenInstanceCrosschainInProgress {
  NotifySharePrice
  SetValuation
}
enum PoolManagerCrosschainInProgress {
  CanManage
  CanNotManage
}

