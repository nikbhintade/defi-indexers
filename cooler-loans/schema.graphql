}

type ClearinghouseCumulativeStats {
  id: ID!
  clearinghouse: Clearinghouse!
  totalUniqueBorrowers: Int!
  totalLoopers: Int!
  currentActiveBorrowers: Int!
  currentActiveLoopers: Int!
  totalLoans: Int!
  currentActiveLoans: Int!
  totalDefaultedLoans: Int!
  totalRepaidLoans: Int!
  totalLoanExtensions: Int!
  lastUpdateBlock: BigInt!
  lastUpdateTimestamp: BigInt!
}

