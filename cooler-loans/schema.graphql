type BorrowerStats {
  id: ID!
  borrower: String!
  clearinghouse: Clearinghouse!
  totalLoans: Int!
  totalDefaultedLoans: Int!
  totalRepaidLoans: Int!
  activeLoans: Int!
  maxActiveLoans: Int!
  maxBorrowedValue: BigDecimal!
  currentBorrowed: BigDecimal!
  currentInterestDue: BigDecimal!
  currentCollateral: BigDecimal!
  lastUpdateBlock: BigInt!
  lastUpdateTimestamp: BigInt!
  totalLoanExtensions: Int!
