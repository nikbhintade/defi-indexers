# Ported from OlympusDAO/cooler-loans-subgraph schema.graphql.
#
# Deviations (see MIGRATION.md):
#  * @entity directives stripped; Bytes -> String (lowercase 0x hex).
#  * Timeseries entities (`@entity(timeseries: true)`) -> plain entities with a
#    deterministic String `id` (txHash-logIndex or address-block-logIndex) and an
#    explicit `timestamp: BigInt`, since HyperIndex has no auto-incrementing Int8
#    timeseries id / auto timestamp.
#  * @aggregation types (DefaultStats, RepaymentStats, ExtensionStats,
#    ClearinghouseSnapshotStats, MonoCooler*Stats) are dropped — HyperIndex has
#    no graph-node aggregation primitive. They are pure read-time rollups of the
#    timeseries source entities, which are all ported, so no source data is lost.

type ClearinghouseSingleton {
  id: ID!
  clearinghouses: [Clearinghouse!]! @derivedFrom(field: "singleton")
}

type Clearinghouse {
  id: ID!
  createdBlock: BigInt!
  createdTimestamp: BigInt!
  address: String!
  version: String!
  singleton: ClearinghouseSingleton! @index
  coolerFactoryAddress: String!
  collateralToken: String!
  collateralTokenDecimals: Int!
  reserveToken: String!
  reserveTokenDecimals: Int!
  sReserveToken: String!
  sReserveTokenDecimals: Int!
  interestRate: BigDecimal!
  duration: BigInt!
  fundCadence: BigInt!
  fundAmount: BigDecimal!
  loanToCollateral: BigDecimal!
  loans: [CoolerLoan!]! @derivedFrom(field: "clearinghouse")
  snapshots: [ClearinghouseSnapshot!]! @derivedFrom(field: "clearinghouse")
}

type CoolerLoanRequest {
  id: ID!
  createdBlock: BigInt!
  createdTimestamp: BigInt!
  createdTransaction: String!
  cooler: String!
  requestId: BigInt!
  borrower: String!
  collateralToken: String!
  debtToken: String!
  amount: BigDecimal!
  interestPercentage: BigDecimal!
  loanToCollateralRatio: BigDecimal!
  durationSeconds: BigInt!
  isRescinded: Boolean!
  requestEvents: [RequestLoanEvent!]! @derivedFrom(field: "request")
  rescindEvents: [RescindLoanRequestEvent!]! @derivedFrom(field: "request")
  clearEvents: [ClearLoanRequestEvent!]! @derivedFrom(field: "request")
  loans: [CoolerLoan!]! @derivedFrom(field: "request")
}

type CoolerLoan {
  id: ID!
  createdBlock: BigInt!
  createdTimestamp: BigInt!
  createdTransaction: String!
  cooler: String!
  request: CoolerLoanRequest!
  loanId: BigInt!
  borrower: BorrowerStats!
  clearinghouse: Clearinghouse!
  interest: BigDecimal!
  principal: BigDecimal!
  collateral: BigDecimal!
  originalExpiryTimestamp: BigInt!
  currentExpiryTimestamp: BigInt!
  hasCallback: Boolean!
  creationEvents: [ClearLoanRequestEvent!]! @derivedFrom(field: "loan")
  defaultedClaimEvents: [ClaimDefaultedLoanEvent!]! @derivedFrom(field: "loan")
  repaymentEvents: [RepayLoanEvent!]! @derivedFrom(field: "loan")
  extendEvents: [ExtendLoanEvent!]! @derivedFrom(field: "loan")
}

# was @entity(timeseries: true)
type ClearinghouseSnapshot {
  id: ID!
  timestamp: BigInt!
  date: String!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: String!
  clearinghouse: Clearinghouse!
  isActive: Boolean!
  nextRebalanceTimestamp: BigInt!
  interestReceivables: BigDecimal!
  principalReceivables: BigDecimal!
  reserveToken: String!
  sReserveToken: String!
  reserveBalance: BigDecimal!
  sReserveBalance: BigDecimal!
  sReserveInReserveBalance: BigDecimal!
  treasuryReserveBalance: BigDecimal!
  treasurySReserveBalance: BigDecimal!
  treasurySReserveInReserveBalance: BigDecimal!
}

### Clearinghouse Events

