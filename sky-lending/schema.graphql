# Ported 1:1 from Messari makerdao subgraph schema.graphql (Lending schema v2.0.1).
# Conversions per CONVENTIONS.md:
#  - Bytes -> String (lowercase 0x hex)
#  - removed @entity(immutable: ...) / @regularPolling / @dailySnapshot / @hourlySnapshot / @transaction directives
#  - kept @derivedFrom; reference fields (e.g. `protocol: LendingProtocol!`) keep the same name (generated as `<field>_id`)
#  - enums kept as-is
# This subgraph serves BOTH "Sky Lending (#13)" and "Sky RWA (#49)" queue rows.

enum Network {
  ARBITRUM_ONE
  ARWEAVE_MAINNET
  AURORA
  AVALANCHE
  BOBA
  BSC
  CELO
  COSMOS
  CRONOS
  MAINNET
  FANTOM
  FUSE
  HARMONY
  JUNO
  MOONBEAM
  MOONRIVER
  NEAR_MAINNET
  OPTIMISM
  OSMOSIS
  MATIC
  XDAI
}

enum ProtocolType {
  EXCHANGE
  LENDING
  YIELD
  BRIDGE
  GENERIC
}

type Token {
  id: ID!
  name: String!
  symbol: String!
  decimals: Int!
  lastPriceUSD: BigDecimal
  lastPriceBlockNumber: BigInt
}

enum RewardTokenType {
  DEPOSIT
  BORROW
}

type RewardToken {
  id: ID!
  token: Token!
