# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: morpho-blue
description: Canonical Morpho Blue + MetaMorpho subgraph (mainnet) ported to HyperIndex
rollback_on_reorg: false
contracts:
  - name: MorphoBlue
    abi_file_path: abis/MorphoBlue.json
    events:
      - event: "AccrueInterest(bytes32 indexed id, uint256 prevBorrowRate, uint256 interest, uint256 feeShares)"
      - event: "Borrow(bytes32 indexed id, address caller, address indexed onBehalf, address indexed receiver, uint256 assets, uint256 shares)"
        field_selection:
          transaction_fields: [hash, nonce, gasPrice, gas]
      - event: "CreateMarket(bytes32 indexed id, (address loanToken, address collateralToken, address oracle, address irm, uint256 lltv) marketParams)"
      - event: "EnableIrm(address indexed irm)"
      - event: "EnableLltv(uint256 lltv)"
      - event: "FlashLoan(address indexed caller, address indexed token, uint256 assets)"
        field_selection:
          transaction_fields: [hash, nonce, gasPrice, gas]
      - event: "IncrementNonce(address indexed caller, address indexed authorizer, uint256 usedNonce)"
      - event: "Liquidate(bytes32 indexed id, address indexed caller, address indexed borrower, uint256 repaidAssets, uint256 repaidShares, uint256 seizedAssets, uint256 badDebtAssets, uint256 badDebtShares)"
        field_selection:
          transaction_fields: [hash, nonce, gasPrice, gas]
      - event: "Repay(bytes32 indexed id, address indexed caller, address indexed onBehalf, uint256 assets, uint256 shares)"
        field_selection:
          transaction_fields: [hash, nonce, gasPrice, gas]
      - event: "SetAuthorization(address indexed caller, address indexed authorizer, address indexed authorized, bool newIsAuthorized)"
      - event: "SetFee(bytes32 indexed id, uint256 newFee)"
      - event: "SetFeeRecipient(address indexed newFeeRecipient)"
      - event: "SetOwner(address indexed newOwner)"
      - event: "Supply(bytes32 indexed id, address indexed caller, address indexed onBehalf, uint256 assets, uint256 shares)"
        field_selection:
          transaction_fields: [hash, nonce, gasPrice, gas]
      - event: "SupplyCollateral(bytes32 indexed id, address indexed caller, address indexed onBehalf, uint256 assets)"
        field_selection:
          transaction_fields: [hash, nonce, gasPrice, gas]
      - event: "Withdraw(bytes32 indexed id, address caller, address indexed onBehalf, address indexed receiver, uint256 assets, uint256 shares)"
        field_selection:
          transaction_fields: [hash, nonce, gasPrice, gas]
      - event: "WithdrawCollateral(bytes32 indexed id, address caller, address indexed onBehalf, address indexed receiver, uint256 assets)"
        field_selection:
          transaction_fields: [hash, nonce, gasPrice, gas]
  - name: MetaMorphoFactory
    abi_file_path: abis/MetaMorphoFactory.json
    events:
      - event: "CreateMetaMorpho(address indexed metaMorpho, address indexed caller, address initialOwner, uint256 initialTimelock, address indexed asset, string name, string symbol, bytes32 salt)"
  # MetaMorpho factory v1.1 (same event/handler; sets version "1.1")
  - name: MetaMorphoFactoryV11
    abi_file_path: abis/MetaMorphoFactory.json
    events:
      - event: "CreateMetaMorpho(address indexed metaMorpho, address indexed caller, address initialOwner, uint256 initialTimelock, address indexed asset, string name, string symbol, bytes32 salt)"
  # Public allocator (writes the MetaMorphoPublicAllocator* entities)
  - name: PublicAllocator
    abi_file_path: abis/PublicAllocator.json
    events:
      - event: "PublicReallocateTo(address indexed sender, address indexed vault, bytes32 indexed supplyMarketId, uint256 suppliedAssets)"
        field_selection:
          transaction_fields: [hash, nonce, gasPrice, gas]
      - event: "PublicWithdrawal(address indexed sender, address indexed vault, bytes32 indexed id, uint256 withdrawnAssets)"
        field_selection:
          transaction_fields: [hash, nonce, gasPrice, gas]
      - event: "SetAdmin(address indexed sender, address indexed vault, address admin)"
      - event: "SetFee(address indexed sender, address indexed vault, uint256 fee)"
      - event: "SetFlowCaps(address indexed sender, address indexed vault, (bytes32 id, (uint128 maxIn, uint128 maxOut) caps)[] config)"
        field_selection:
          transaction_fields: [hash, nonce, gasPrice, gas]
      - event: "TransferFee(address indexed sender, address indexed vault, uint256 amount, address indexed feeRecipient)"
  # Subgraph template: MetaMorpho vault (registered dynamically on CreateMetaMorpho)
  - name: MetaMorpho
    abi_file_path: abis/MetaMorpho.json
    events:
      - event: "AccrueInterest(uint256 newTotalAssets, uint256 feeShares)"
      - event: "Approval(address indexed owner, address indexed spender, uint256 value)"
      - event: "Deposit(address indexed sender, address indexed owner, uint256 assets, uint256 shares)"
        field_selection:
          transaction_fields: [hash, nonce, gasPrice, gas]
      - event: "EIP712DomainChanged()"
      - event: "OwnershipTransferStarted(address indexed previousOwner, address indexed newOwner)"
      - event: "OwnershipTransferred(address indexed previousOwner, address indexed newOwner)"
      - event: "ReallocateSupply(address indexed caller, bytes32 indexed id, uint256 suppliedAssets, uint256 suppliedShares)"
      - event: "ReallocateWithdraw(address indexed caller, bytes32 indexed id, uint256 withdrawnAssets, uint256 withdrawnShares)"
      - event: "RevokePendingCap(address indexed caller, bytes32 indexed id)"
      - event: "RevokePendingGuardian(address indexed caller)"
      - event: "RevokePendingMarketRemoval(address indexed caller, bytes32 indexed id)"
      - event: "RevokePendingTimelock(address indexed caller)"
      - event: "SetCap(address indexed caller, bytes32 indexed id, uint256 cap)"
      - event: "SetCurator(address indexed newCurator)"
      - event: "SetFee(address indexed caller, uint256 newFee)"
      - event: "SetFeeRecipient(address indexed newFeeRecipient)"
      - event: "SetGuardian(address indexed caller, address indexed guardian)"
      - event: "SetIsAllocator(address indexed allocator, bool isAllocator)"
        field_selection:
          transaction_fields: [hash, nonce, gasPrice, gas]
      - event: "SetName(string name)"
      - event: "SetSkimRecipient(address indexed newSkimRecipient)"
      - event: "SetSupplyQueue(address indexed caller, bytes32[] newSupplyQueue)"
      - event: "SetSymbol(string symbol)"
      - event: "SetTimelock(address indexed caller, uint256 newTimelock)"
      - event: "SetWithdrawQueue(address indexed caller, bytes32[] newWithdrawQueue)"
      - event: "Skim(address indexed caller, address indexed token, uint256 amount)"
      - event: "SubmitCap(address indexed caller, bytes32 indexed id, uint256 cap)"
      - event: "SubmitGuardian(address indexed newGuardian)"
      - event: "SubmitMarketRemoval(address indexed caller, bytes32 indexed id)"
      - event: "SubmitTimelock(uint256 newTimelock)"
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"
        field_selection:
          transaction_fields: [hash, nonce, gasPrice, gas]
      - event: "UpdateLastTotalAssets(uint256 updatedTotalAssets)"
      - event: "Withdraw(address indexed sender, address indexed receiver, address indexed owner, uint256 assets, uint256 shares)"
        field_selection:
          transaction_fields: [hash, nonce, gasPrice, gas]
chains:
  - id: 1
    start_block: 18883124
    # end_block: 18933124   # uncomment for bounded validation runs (start + 50k, see validation.json)
    contracts:
      - name: MorphoBlue
        address: "0xBBBBBbbBBb9cC5e90e3b3Af64bdAF62C37EEFFCb"
      - name: MetaMorphoFactory
        address: "0xa9c3d3a366466fa809d1ae982fb2c46e5fc41101"
      - name: MetaMorphoFactoryV11
        address: "0x1897A8997241C1cD4bD0698647e4EB7213535c24"
      - name: PublicAllocator
        address: "0xfd32fA2ca22c76dD6E550706Ad913FC6CE91c75D"
      # dynamically registered template (no static address)
      - name: MetaMorpho
